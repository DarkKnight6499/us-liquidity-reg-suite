[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-liquidity-reg-suite"
version = "0.1.0"
description = "Synthetic US bank liquidity measurement and reporting library"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
